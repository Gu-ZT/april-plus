name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pull_request.yml
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      CI_BUILD: false
      PR_BUILD: true
      BUILD_TYPE: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: 25

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Project
        run: ./gradlew build

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_name minecraft_version fabric_version'

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls ./build/libs/* | grep sources.jar -v | awk -F '${{ steps.properties.outputs.mod_name }}-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar

      - name: Game Test
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        with:
          minecraft_version: '${{ steps.properties.outputs.minecraft_version }}'
          mod_loader: 'fabric'
          loader_version: '0.18.6'
          mods: build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar
          maven-repos: |
            https://maven.fabricmc.net/
          maven-mods: |
            net.fabricmc.fabric-api:fabric-api:${{ steps.properties.outputs.fabric_version }}
