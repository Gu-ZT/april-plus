name: Update Release Asset
on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      CI_BUILD: false
      PR_BUILD: false
      BUILD_TYPE: release
      VERSION_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: 25

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Project
        run: ./gradlew build

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_name minecraft_version fabric_version'

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls ./build/libs/* | grep sources.jar -v | awk -F '${{ steps.properties.outputs.mod_name }}-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar

      - name: Game Test
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        with:
          minecraft_version: '${{ steps.properties.outputs.minecraft_version }}'
          mod_loader: 'fabric'
          loader_version: '0.18.6'
          mods: build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar
          maven-repos: |
            https://maven.fabricmc.net/
          maven-mods: |
            net.fabricmc.fabric-api:fabric-api:${{ steps.properties.outputs.fabric_version }}

      - name: Upload Release Jar
        if: ${{ !env.CI_BUILD && !env.PR_BUILD }}
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: |
            build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar

      - name: Publish Mod
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "${{ steps.properties.outputs.mod_name }} For Fabric v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          loaders: fabric
          game-versions: ${{ steps.properties.outputs.minecraft_version }}
          version-type: ${{ env.VERSION_TYPE }}
          fail-mode: skip

          dependencies: |
            fabric-api@${{ steps.properties.outputs.fabric_version }}(required){modrinth:P7dR8mSH}{curseforge:306612}

          modrinth-id: ?!
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: ?!
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}.jar
            build/libs/${{ steps.properties.outputs.mod_name }}-${{ steps.version.outputs.version }}-sources.jar
